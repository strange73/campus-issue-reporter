<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Issue Reporter</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <h1>🛠️ Campus Issue Reporter</h1>
      <p class="tagline">Broken fans, leaking taps, dead lights — report it, track it, get it fixed.</p>
    </div>
  </header>

  <main class="wrap">

    <section class="card" id="report-section">
      <h2>Report an Issue</h2>
      <form id="issue-form">
        <div class="field">
          <label for="title">Issue title *</label>
          <input type="text" id="title" name="title" placeholder="e.g. Leaking tap in Block C washroom" required maxlength="120">
        </div>

        <div class="field-row">
          <div class="field">
            <label for="category">Category *</label>
            <select id="category" name="category" required>
              <option value="" disabled selected>Select category</option>
              {% for c in categories %}
              <option value="{{ c }}">{{ c }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="field">
            <label for="location">Location *</label>
            <input type="text" id="location" name="location" placeholder="e.g. Block C, 2nd floor" required maxlength="120">
          </div>
        </div>

        <div class="field">
          <label for="description">Description (optional)</label>
          <textarea id="description" name="description" rows="3" placeholder="Any extra detail that helps fix it faster"></textarea>
        </div>

        <button type="submit" class="btn-primary">Submit Report</button>
        <span id="form-message" class="form-message"></span>
      </form>
    </section>

    <section class="card" id="board-section">
      <div class="board-header">
        <h2>Status Board</h2>
        <div class="controls">
          <select id="filter-status">
            <option value="All">All statuses</option>
            {% for s in statuses %}
            <option value="{{ s }}">{{ s }}</option>
            {% endfor %}
          </select>

          <select id="filter-category">
            <option value="All">All categories</option>
            {% for c in categories %}
            <option value="{{ c }}">{{ c }}</option>
            {% endfor %}
          </select>

          <select id="sort-by">
            <option value="recent">Most recent</option>
            <option value="upvotes">Most upvoted</option>
          </select>
        </div>
      </div>

      <div class="board" id="board">
        <div class="board-column" data-status="Open">
          <h3>🔴 Open <span class="count" id="count-open">0</span></h3>
          <div class="column-list" id="list-open"></div>
        </div>
        <div class="board-column" data-status="In Progress">
          <h3>🟡 In Progress <span class="count" id="count-inprogress">0</span></h3>
          <div class="column-list" id="list-inprogress"></div>
        </div>
        <div class="board-column" data-status="Fixed">
          <h3>🟢 Fixed <span class="count" id="count-fixed">0</span></h3>
          <div class="column-list" id="list-fixed"></div>
        </div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p>Web Forge · Campus Issue Reporter · PS-02</p>
  </footer>

  <template id="card-template">
    <div class="issue-card">
      <div class="issue-top">
        <span class="category-chip"></span>
        <button class="upvote-btn" title="Upvote this issue">▲ <span class="upvote-count">0</span></button>
      </div>
      <h4 class="issue-title"></h4>
      <p class="issue-location"></p>
      <p class="issue-description"></p>
      <div class="issue-bottom">
        <span class="issue-time"></span>
        <select class="status-select">
          <option value="Open">Open</option>
          <option value="In Progress">In Progress</option>
          <option value="Fixed">Fixed</option>
        </select>
      </div>
    </div>
  </template>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
